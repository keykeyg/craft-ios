# XcodeGen spec for one app. build_app.sh fills the KG_* settings.
name: KGApp
options:
  bundleIdPrefix: com.keyangodarzi.kg
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SDKROOT: iphoneos
    ARCHS: arm64
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    DEBUG_INFORMATION_FORMAT: dwarf
    COPY_PHASE_STRIP: YES
    STRIP_INSTALLED_PRODUCT: YES
    DEAD_CODE_STRIPPING: NO
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Distribution"
targets:
  KGApp:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: main.c
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Payload
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: $(KG_PRODUCT_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(KG_BUNDLE_ID)
        MARKETING_VERSION: $(KG_VERSION)
        CURRENT_PROJECT_VERSION: $(KG_BUILD)
        DEVELOPMENT_TEAM: $(KG_TEAM)
        PROVISIONING_PROFILE_SPECIFIER: $(KG_PROFILE)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
    postBuildScripts:
      - name: Embed Rust app
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          cp "$KG_RUST_BIN" "$TARGET_BUILD_DIR/$EXECUTABLE_PATH"
          chmod 755 "$TARGET_BUILD_DIR/$EXECUTABLE_PATH"
          # Payload/ was copied as a folder resource; flatten it into the bundle root.
          if [ -d "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Payload" ]; then
            cp -R "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Payload/." "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/"
            rm -rf "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Payload"
          fi
